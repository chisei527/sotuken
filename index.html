<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MathBlock - 数式パズル</title>
    
    <!-- CDN への接続を先に張っておく（DNS + TLS のぶん初回が速くなる） -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Blockly: バージョンを固定する。
         以前は https://unpkg.com/blockly/blockly.min.js とバージョン無指定で、
         毎回 unpkg 側でのリダイレクトが1往復挟まる上、いつ最新版に上がって
         壊れてもおかしくない状態だった。
         defer にしてパーサーを止めないようにする（実行順は記述順のまま保たれる）。 -->
    <script defer src="https://unpkg.com/blockly@10.4.3/blockly.min.js"></script>

    <!-- mathjs: .min.js を使う。判定ロジックの心臓部なので遅延はさせない -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>

    <!-- MathJax は「解説の数式組版」でしか使わない。約 1MB あるので
         起動時には読まず、初めて必要になったとき app-ui.js の
         ensureMathJaxLoaded() が動的に読み込む。 -->

    <!-- Supabase（サーバー）: バージョン固定。config.js が空ならサーバーは使わない -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script defer src="config.js"></script>
    <script defer src="storage.js"></script>
    <script defer src="app-state.js"></script>
    <script defer src="cloud.js"></script>
    <script defer src="math-logic.js"></script>
    <script defer src="explanations.js"></script>
    <script defer src="app-effects.js"></script>
    <script defer src="app-ui.js"></script>
    <script defer src="blocks.js"></script>
    <script defer src="app-unlock.js"></script>
    <script defer src="workspace.js"></script>
    <script defer src="main.js"></script>      
    <script defer src="tutorial.js"></script>  
    <script defer src="app.js"></script>
    <script defer src="app-guide.js"></script>
    <script defer src="app-popups.js"></script>
    <script defer src="character-data.js"></script>
    <script defer src="character-dialog.js"></script>
    <script defer src="character-scenes.js"></script>
    <script defer src="character-mascot.js"></script>
    <script defer src="block-svg.js"></script>
    <script defer src="basics-tutorial-data.js"></script>
    <script defer src="basics-tutorial.js"></script>
    <script defer src="pal-tutorial-data.js"></script>
    <script defer src="pal-tutorial.js"></script>
    <script defer src="account-ui.js"></script>
    <script defer src="tutorial-complete.js"></script>

    <!-- CSS 分割ファイル -->
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/actions.css">
    <link rel="stylesheet" href="styles/effects.css">
    <link rel="stylesheet" href="styles/blockly-fields.css">
    <link rel="stylesheet" href="styles/stage-map.css">
    <link rel="stylesheet" href="styles/entrance.css">
    <link rel="stylesheet" href="styles/character-dialog.css">
    <link rel="stylesheet" href="styles/mascot.css">
    <link rel="stylesheet" href="styles/waiting-hint.css">
    <link rel="stylesheet" href="styles/header-tools.css">
    <link rel="stylesheet" href="styles/formula-ref.css">
    <link rel="stylesheet" href="styles/transition.css">
    <link rel="stylesheet" href="styles/account.css">
</head>
<body>
    <div id="transition-curtain" class="curtain hidden"></div>
    
    <div id="game-entrance">
      <div id="start-prompt-text">TAP TO START</div>

      <div class="entrance-card">
        <p class="entrance-eyebrow">SYSTEM STATUS: OPERATIONAL</p>
        <h1 class="entrance-title" style="font-size: 2.2rem; margin-bottom: 8px;">オペレーションモード選択</h1>
        <p class="entrance-subtitle" style="margin-top: 0;">基礎プロトコルを走査するか、即座にメインステージへアクセスするかを選択せよ。</p>
        <div class="entrance-choice-row">
          <button id="btn-entry-tutorial" class="entrance-choice" type="button">
            <h3>基本論理の学習（推奨）</h3>
            <p>ブロックデバイスの稼働、およびデータ変形論理を最短ステップでシミュレートする。</p>
          </button>
          <button id="btn-entry-map" class="entrance-choice" type="button">
            <h3>数式領域への直接介入</h3>
            <p>初期ブートシーケンスをスキップし、セクター001より完全な証明介入を開始する。</p>
          </button>
        </div>
      </div>
    </div>

    <!-- 📘 公式リファレンスモーダル（ヘッダー「公式解説」ボタンから開く） -->
    <div id="formula-reference-modal" class="overlay-screen hidden">
      <div class="formula-ref-card">
        <button id="btn-formula-reference-close" class="action-btn btn-primary" type="button" aria-label="閉じる" title="閉じる">×</button>
        <h2>📘 公式リファレンス</h2>
        <div class="formula-ref-tabs" id="formula-ref-tabs"><!-- タブをJSで生成 --></div>
        <div class="formula-ref-body">
          <div class="formula-text-area" id="formula-ref-text"><!-- 内容をJSで生成 --></div>
          <div class="formula-ref-image" id="formula-ref-image"><!-- SVGをJSで生成 --></div>
        </div>
      </div>
    </div>

    <div id="stage-map-screen" class="screen hidden a">
      <div class="map-topbar">
        <div class="map-title-wrap">
          <h1>MathBlock Progression Map</h1>
          <p class="map-subtitle">ステージ選択: チャレンジするノードを選択してください</p>
        </div>
        <div class="map-controls">
          <span id="map-progress">読み込み中…</span><!-- renderStageMap() が実問題数で上書きする -->
          <button id="btn-unlock-all" class="map-control-btn" onclick="unlockAllStages()">全問題を開放</button>
          <button class="map-control-btn" onclick="resetSaveData()">データリセット</button>
        </div>
      </div>
      <div id="map-viewport" class="map-canvas">
        <div id="map-world">
          <div id="map-nodes"></div>
        </div>
      </div>
    </div>

    <div id="p" class="a">
        <div id="h">
          <div class="header-left">
            <button id="btn-back">ステージ選択</button>
            <div id="stage-nav-buttons">
              <button id="btn-prev-stage" class="stage-nav-btn" title="前の問題へ">←</button>
              <button id="btn-next-stage" class="stage-nav-btn" title="次の問題へ">→</button>
            </div>
          </div>
          <div class="header-center">
            <div id="r">STAGE</div>
            <!-- 連続正解カウンター。app-ui.js の updateStreakCounter() が更新する。
                 以前は要素自体が存在せず、関数が毎回空振りしていた。 -->
            <div id="streak-counter">🔥 0</div>
          </div>
          <div class="header-right">
            <button id="btn-overwrite-permission" class="overwrite-toggle-btn off">ガイド機能: OFF</button>
            <button id="btn-formula-reference" class="header-tool-btn" type="button" title="公式を解説します">📘 公式解説</button>
          </div>
        </div>
        
        <div id="tutorial-progress-shell">
          <div id="tutorial-progress-meta"><span id="tutorial-progress-label">チュートリアル</span><span id="tutorial-progress-rate">0%</span></div>
          <div id="tutorial-progress-track"><div id="tutorial-progress-fill"></div></div>
        </div>
        
        <div id="tutorial-banner"></div>
        <div id="i"><span id="s"></span></div>
        
        <div id="tutorial-next-under-problem"></div>
        
        <div id="l"></div>
        <div id="toast-message" class="toast hidden"></div> 
        
        <div class="action-bar-container">
          <button id="btn-reset" class="action-btn btn-secondary">リセット</button>
          <button id="btn-answer" class="action-btn btn-danger">あきらめる</button>
          <button id="btn-hint" class="action-btn btn-warning">ヒント</button>
          <button id="btn-submit" class="action-btn btn-primary">正解をチェック</button>
        </div>
    </div>

    <div id="tutorial-highlight-source" class="tutorial-pulse-source hidden"></div>
    <div id="tutorial-highlight-target" class="tutorial-pulse-target hidden"></div>


    <div id="cyber-transition">
      <div class="cyber-shutter top"></div>
      <div class="cyber-shutter bottom"></div>
      <div class="cyber-flash"></div>
      <div class="cyber-boot-loader" id="cyber-boot-text">BOOTING PROTOCOL...</div>
    </div>
</body>
</html>
